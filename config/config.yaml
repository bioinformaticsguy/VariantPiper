# =============================================================================
# VariantPiper — pipeline configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Sample sheet
# Point to a YAML file that maps sample IDs to their FASTQ paths.
# Each entry: sample_id -> {R1: path_or_list, R2: path_or_list}
# Multi-lane samples: provide R1/R2 as lists (sorted to match lanes).
# See samplesheets/ for examples.
# ---------------------------------------------------------------------------
samplesheet: "samplesheets/test.tsv"

# ---------------------------------------------------------------------------
# Output directory
# ---------------------------------------------------------------------------
outdir: "output"

# ---------------------------------------------------------------------------
# Reference genome (needed from Step 2 onward)
# Point this to your indexed hg38/GRCh38 FASTA.
# ---------------------------------------------------------------------------
reference: "resources/reference/hg38.fa"

# ---------------------------------------------------------------------------
# Output filtering
# When true: keep only PASS variants in the final SNV and SV VCFs.
# SNVs: produces the Phase I main deliverable {sample}.pass.vcf.gz.
# SVs:  the Manta deliverable {sample}.manta.vcf.gz contains only PASS calls.
# ---------------------------------------------------------------------------
filter_pass: true

# Keep the full unfiltered DeepVariant VCF as a debug deliverable under
# snv_calls/. The gVCF and PASS VCF are always retained.
keep_full_deepvariant_vcf: false

# ---------------------------------------------------------------------------
# Cleanup trimmed FASTQs
# When true: fastp output (trimmed R1/R2) is deleted automatically by
# Snakemake as soon as alignment completes. Saves ~30-50 GB per 30x sample.
# Set to false to keep trimmed files (useful for debugging or re-running QC).
# ---------------------------------------------------------------------------
cleanup_trimmed: false

# ---------------------------------------------------------------------------
# Coverage QC with mosdepth
# ---------------------------------------------------------------------------
# The mosdepth summary is always retained. Per-base coverage can be very large,
# so it is disabled by default. Provide a BED file to also create
# {sample}.regions.bed.gz for downstream VIPER/DSD coverage summaries.
# ---------------------------------------------------------------------------
keep_per_base_coverage: false
coverage_regions_bed: null

mosdepth:
  extra: ""

# ---------------------------------------------------------------------------
# Step 4 — SV calling
# VariantPiper Phase I uses Manta and writes {sample}.manta.vcf.gz directly.
# No generic {sample}.sv.vcf.gz is created unless a future true merged SV file
# is added.
# ---------------------------------------------------------------------------
sv_caller: manta

# Manta settings
manta:
  extra: ""   # additional configManta.py flags (e.g. --callRegions bed.gz for targeted)

# ---------------------------------------------------------------------------
# Step 3 — Variant calling (DeepVariant)
# ---------------------------------------------------------------------------
deepvariant:
  sif: "resources/singularity/deepvariant_1.6.1.sif"  # path to Singularity image
  model_type: "WGS"       # WGS for whole genome, WES for exome
  singularity_bind: "/data"  # bind path(s) for singularity — must cover reference,
                              # BAM, and output dirs; adjust for your cluster
  extra: ""               # any additional run_deepvariant flags

# ---------------------------------------------------------------------------
# Step 2 — Alignment (BWA-MEM2)
# ---------------------------------------------------------------------------
bwa_mem2:
  extra: ""   # any additional bwa-mem2 mem flags (e.g. "-M" for Picard compatibility)

# ---------------------------------------------------------------------------
# Step 1 — QC (fastp)
# ---------------------------------------------------------------------------
fastp:
  min_read_length: 50         # discard reads shorter than this after trimming
  qualified_quality_phred: 20 # minimum base quality
  extra: ""                   # any additional fastp flags

samplegender:
  method: "xy"                # SampleGender method: xy, hetx, or sry
  extra: ""                   # any additional SampleGender flags
