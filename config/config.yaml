# =============================================================================
# VariantPiper — pipeline configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Samples
# Each entry: sample_id -> {R1: path, R2: path}
# Paths are relative to the working directory (project root).
# ---------------------------------------------------------------------------
samples:
  test:
    R1: "test_data/test_R1.fastq.gz"
    R2: "test_data/test_R2.fastq.gz"

# ---------------------------------------------------------------------------
# Output directory
# ---------------------------------------------------------------------------
outdir: "output"

# ---------------------------------------------------------------------------
# Reference genome (needed from Step 2 onward)
# Point this to your indexed hg38/GRCh38 FASTA.
# ---------------------------------------------------------------------------
reference: "resources/reference/hg38.fa"

# ---------------------------------------------------------------------------
# Output filtering
# When true: keep only PASS variants in the final SNV and SV VCFs.
# SNVs: produces {sample}.pass.vcf.gz alongside the full DeepVariant VCF.
# SVs:  the single {sample}.sv.vcf.gz contains only PASS-filtered calls.
# Set to false to skip filtering and keep all variants.
# ---------------------------------------------------------------------------
filter_pass: true

# ---------------------------------------------------------------------------
# Step 4 — SV calling
# sv_caller selects which tool is used. Both rule sets are always compiled;
# only the active caller's rules are executed.
#   manta  — Illumina Manta v1.6.0 (default, recommended for WGS)
#   delly  — EMBL-EBI Delly
# ---------------------------------------------------------------------------
sv_caller: manta

# Manta settings
manta:
  extra: ""   # additional configManta.py flags (e.g. --callRegions bed.gz for targeted)

# Delly settings (used when sv_caller: delly)
delly:
  extra: "-x resources/delly/human.hg38.excl.tsv"   # exclusion list downloaded by install.sh

# ---------------------------------------------------------------------------
# Step 3 — Variant calling (DeepVariant)
# ---------------------------------------------------------------------------
deepvariant:
  sif: "resources/singularity/deepvariant_1.6.1.sif"  # path to Singularity image
  model_type: "WGS"       # WGS for whole genome, WES for exome
  singularity_bind: "/data"  # bind path(s) for singularity — must cover reference,
                              # BAM, and output dirs; adjust for your cluster
  extra: ""               # any additional run_deepvariant flags

# ---------------------------------------------------------------------------
# Step 2 — Alignment (BWA-MEM2)
# ---------------------------------------------------------------------------
bwa_mem2:
  extra: ""   # any additional bwa-mem2 mem flags (e.g. "-M" for Picard compatibility)

# ---------------------------------------------------------------------------
# Step 1 — QC (fastp)
# ---------------------------------------------------------------------------
fastp:
  min_read_length: 50         # discard reads shorter than this after trimming
  qualified_quality_phred: 20 # minimum base quality
  extra: ""                   # any additional fastp flags
