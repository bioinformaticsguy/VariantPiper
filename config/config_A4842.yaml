# =============================================================================
# VariantPiper — configuration for A4842 (real data run)
# =============================================================================

# ---------------------------------------------------------------------------
# Samples
# ---------------------------------------------------------------------------
samples:
  A4842:
    R1: "/data/humangen_sfb1665_seqdata/short_read/raw/A4842/A4842_DNA_01/A4842_DNA_01_S1_L001_R1_001.fastq.gz"
    R2: "/data/humangen_sfb1665_seqdata/short_read/raw/A4842/A4842_DNA_01/A4842_DNA_01_S1_L001_R2_001.fastq.gz"

# ---------------------------------------------------------------------------
# Output directory
# ---------------------------------------------------------------------------
outdir: "output"

# ---------------------------------------------------------------------------
# Reference genome
# ---------------------------------------------------------------------------
reference: "resources/reference/hg38.fa"

# ---------------------------------------------------------------------------
# Output filtering
# ---------------------------------------------------------------------------
filter_pass: true

# ---------------------------------------------------------------------------
# Step 4 — SV calling (Delly)
# ---------------------------------------------------------------------------
delly:
  extra: "-x resources/delly/human.hg38.excl.tsv"   # exclusion list downloaded by install.sh

# ---------------------------------------------------------------------------
# Step 3 — Variant calling (DeepVariant)
# ---------------------------------------------------------------------------
deepvariant:
  sif: "resources/singularity/deepvariant_1.6.1.sif"
  model_type: "WGS"
  singularity_bind: "/data"
  extra: ""

# ---------------------------------------------------------------------------
# Step 2 — Alignment (BWA-MEM2)
# ---------------------------------------------------------------------------
bwa_mem2:
  extra: ""

# ---------------------------------------------------------------------------
# Step 1 — QC (fastp)
# ---------------------------------------------------------------------------
fastp:
  min_read_length: 50
  qualified_quality_phred: 20
  extra: ""
