# =============================================================================
# VariantPiper — configuration for A4842 (real data run)
# =============================================================================

# ---------------------------------------------------------------------------
# Output directory
# ---------------------------------------------------------------------------
outdir: "output"

# ---------------------------------------------------------------------------
# Reference genome
# ---------------------------------------------------------------------------
reference: "resources/reference/hg38.fa"

# ---------------------------------------------------------------------------
# Output filtering
# ---------------------------------------------------------------------------
filter_pass: true

# ---------------------------------------------------------------------------
# Cleanup trimmed FASTQs after alignment completes
# ---------------------------------------------------------------------------
cleanup_trimmed: true

# ---------------------------------------------------------------------------
# Step 4 — SV calling
# ---------------------------------------------------------------------------
sv_caller: manta   # manta (default) or delly

manta:
  extra: ""

delly:
  extra: "-x resources/delly/human.hg38.excl.tsv"

# ---------------------------------------------------------------------------
# Step 3 — Variant calling (DeepVariant)
# ---------------------------------------------------------------------------
deepvariant:
  sif: "resources/singularity/deepvariant_1.6.1.sif"
  model_type: "WGS"
  singularity_bind: "/data"
  postprocess_cpus: 16
  extra: ""

# ---------------------------------------------------------------------------
# Step 2 — Alignment (BWA-MEM2)
# ---------------------------------------------------------------------------
bwa_mem2:
  extra: ""

# ---------------------------------------------------------------------------
# Step 1 — QC (fastp)
# ---------------------------------------------------------------------------
fastp:
  min_read_length: 50
  qualified_quality_phred: 20
  extra: ""

samplegender:
  method: "xy"
  extra: ""
